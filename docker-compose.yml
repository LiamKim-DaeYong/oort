services:
  postgres:
    image: postgres:16-alpine
    container_name: oort-postgres
    environment:
      POSTGRES_DB: oort_notification
      POSTGRES_USER: oort
      POSTGRES_PASSWORD: oort
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oort -d oort_notification"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-server:
    build:
      context: .
      dockerfile: mock-server/Dockerfile
      args:
        JAR_FILE: build/libs/mock-server-0.0.1-SNAPSHOT.jar
    container_name: oort-mock-server
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: local
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
