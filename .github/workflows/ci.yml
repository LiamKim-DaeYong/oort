name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: Gradle Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run checks
        run: ./gradlew ktlintCheck test build
